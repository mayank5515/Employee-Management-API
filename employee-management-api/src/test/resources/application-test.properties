# Used by API tests: in-memory H2 in PostgreSQL mode, so no real DB is required
spring.datasource.url=jdbc:h2:mem:employeedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
