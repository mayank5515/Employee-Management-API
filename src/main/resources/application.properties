spring.application.name=employee-management-api

# Database (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate - 'update' creates the table automatically (fine for a demo project)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
